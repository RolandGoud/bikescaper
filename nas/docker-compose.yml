# Bike Compare test environment for a NAS, in one file.
# Nothing else is needed next to this file: on first start the container downloads
# the code from GitHub, installs it and loads the bike catalogue.
#
# UGREEN NAS: Docker app > Project > Create, paste this file, deploy.
# The site is then at http://<nas-ip>:8280 (the first start takes a few minutes).
#
# To get newer code: stop the project, delete the "bikecompare-code" volume, start again.
# Saved checks are in "bikecompare-data" and are kept.

services:
  bikecompare:
    image: python:3.13-slim
    container_name: bikecompare
    working_dir: /app
    environment:
      BRANCH: claude/site-prototype
      BIKECOMPARE_DB: /data/bikecompare.sqlite3
      PYTHONUNBUFFERED: "1"
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f webapp/app.py ]; then
          echo "Downloading Bike Compare from GitHub..."
          python -c "
        import io, os, tarfile, urllib.request
        url = 'https://codeload.github.com/RolandGoud/bikescaper/tar.gz/refs/heads/' + os.environ['BRANCH']
        keep = ('webapp/', 'data/Trek/', 'data/Canyon/', 'images/')
        tar = tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(url).read()))
        members = [m for m in tar.getmembers() if m.isfile() and m.name.split('/', 1)[-1].startswith(keep)]
        for m in members:
            m.name = m.name.split('/', 1)[1]
        tar.extractall('/app', members=members, filter='data')
        "
        fi
        pip install --no-cache-dir --quiet --root-user-action=ignore -r webapp/requirements.txt
        python -m webapp.seed --if-empty
        exec gunicorn --bind 0.0.0.0:8000 --workers 2 --access-logfile - webapp.app:app
    ports:
      - "8280:8000"
    volumes:
      - bikecompare-code:/app    # the downloaded code
      - bikecompare-data:/data   # the database with saved checks
    restart: unless-stopped

volumes:
  bikecompare-code:
  bikecompare-data:
