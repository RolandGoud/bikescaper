# Bike Compare test environment for a NAS, in one file.
# Nothing else is needed next to this file: on every start the container downloads
# the latest code from GitHub, installs it and loads the bike catalogue.
#
# UGREEN NAS: Docker app > Project > Create, paste this file, deploy.
# The site is then at http://<nas-ip>:8280 (the first start takes a few minutes).
#
# To get newer code: restart the container. Saved checks are in "bikecompare-data" and are kept.

services:
  bikecompare:
    image: python:3.13-slim
    container_name: bikecompare
    working_dir: /app
    environment:
      BRANCH: main
      BIKECOMPARE_DB: /data/bikecompare.sqlite3
      PYTHONUNBUFFERED: "1"
      # To let people mail themselves their check report, fill these in and remove the #:
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: "587"
      # SMTP_USER: you@gmail.com
      # SMTP_PASSWORD: your-app-password
      # MAIL_FROM: you@gmail.com
      # Only when the site is reached through a reverse proxy (e.g. the NAS's own), so the mail
      # limit sees each visitor's address instead of the proxy's:
      # BEHIND_PROXY: "1"
    command:
      - sh
      - -c
      - |
        set -e
        # Fetch the latest code from GitHub on every start, so a restart is an update.
        # If GitHub can't be reached, keep running the code from the last start.
        echo "Downloading Bike Compare ($$BRANCH) from GitHub..."
        python -c "
        import io, os, shutil, sys, tarfile, urllib.request
        url = 'https://codeload.github.com/RolandGoud/bikescaper/tar.gz/refs/heads/' + os.environ['BRANCH']
        try:
            data = urllib.request.urlopen(url, timeout=120).read()
        except Exception as exc:
            if os.path.exists('/app/webapp/app.py'):
                sys.exit(f'Download failed ({exc}); starting the code from last time')
            raise
        keep = ('webapp/', 'images/') + tuple(f'data/{b}/' for b in
                ('Trek', 'Canyon', 'Specialized', 'Giant', 'Cannondale', 'Cube', 'Factor'))
        tar = tarfile.open(fileobj=io.BytesIO(data))
        members = [m for m in tar.getmembers() if m.isfile() and m.name.split('/', 1)[-1].startswith(keep)]
        for m in members:
            m.name = m.name.split('/', 1)[1]
        for d in ('webapp', 'data', 'images'):
            shutil.rmtree(os.path.join('/app', d), ignore_errors=True)
        tar.extractall('/app', members=members, filter='data')
        " || true
        pip install --no-cache-dir --quiet --root-user-action=ignore -r webapp/requirements.txt
        python -m webapp.seed --if-empty
        exec gunicorn --bind 0.0.0.0:8000 --workers 2 --access-logfile - webapp.app:app
    ports:
      - "8280:8000"
    volumes:
      - bikecompare-code:/app    # the downloaded code
      - bikecompare-data:/data   # the database with saved checks
    restart: unless-stopped

volumes:
  bikecompare-code:
  bikecompare-data:
