# Bike Compare test environment for a NAS, in one file.
# Nothing else is needed next to this file: on every start the container downloads
# the latest code from GitHub, installs it and loads the bike catalogue.
#
# UGREEN NAS: Docker app > Project > Create, paste this file, deploy.
# The site is then at http://<nas-ip>:8280 (the first start takes a few minutes).
#
# New code on GitHub is picked up by itself: every 10 minutes the container checks for a new
# commit, installs it and reloads the site without stopping it. A restart also updates.
# Saved checks are in "bikecompare-data" and are kept.

services:
  bikecompare:
    image: python:3.13-slim
    container_name: bikecompare
    working_dir: /app
    environment:
      BRANCH: main
      UPDATE_MINUTES: "10"   # how often to check GitHub for new code; "0" turns it off
      BIKECOMPARE_DB: /data/bikecompare.sqlite3
      PYTHONUNBUFFERED: "1"
      # To let people mail themselves their check report, fill these in and remove the #:
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: "587"
      # SMTP_USER: you@gmail.com
      # SMTP_PASSWORD: your-app-password
      # MAIL_FROM: you@gmail.com
      # Mail also confirms the addresses left for the photo review; to hear about each confirmed one:
      # NOTIFY_EMAIL: you@gmail.com
      # Only when the site is reached through a reverse proxy (e.g. the NAS's own), so the mail
      # limit sees each visitor's address instead of the proxy's:
      # BEHIND_PROXY: "1"
    command:
      - sh
      - -c
      - |
        set -e
        # Get the updater (nas/autoupdate.py) and with it the latest code from GitHub, so a
        # restart is an update. If GitHub can't be reached, keep running the code from last time.
        echo "Downloading Bike Compare ($$BRANCH) from GitHub..."
        python -c "
        import os, urllib.request
        url = ('https://raw.githubusercontent.com/RolandGoud/bikescaper/'
               + os.environ['BRANCH'] + '/nas/autoupdate.py')
        try:
            code = urllib.request.urlopen(url, timeout=60).read()
            compile(code, 'autoupdate.py', 'exec')
            open('/app/autoupdate.py', 'wb').write(code)
        except Exception as exc:
            print(f'Could not get the updater ({exc}); using the one from last time')
        "
        python /app/autoupdate.py --now
        pip install --no-cache-dir --quiet --root-user-action=ignore -r webapp/requirements.txt
        python -m webapp.seed --if-empty
        # Check GitHub for a new commit every UPDATE_MINUTES and switch to it without downtime.
        python /app/autoupdate.py --watch &
        exec gunicorn --bind 0.0.0.0:8000 --workers 2 --access-logfile - webapp.app:app
    ports:
      - "8280:8000"
    volumes:
      - bikecompare-code:/app    # the downloaded code
      - bikecompare-data:/data   # the database with saved checks
    restart: unless-stopped

volumes:
  bikecompare-code:
  bikecompare-data:
