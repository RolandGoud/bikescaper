<svg viewBox="0 0 720 160" role="img" aria-label="Price verdicts" xmlns="http://www.w3.org/2000/svg"><title>Price verdicts</title><text x="30.0" y="18.0" class="cap" text-anchor="start">Where an asking price lands, for a fair range of €1,620 to €1,980</text><rect x="30.0" y="70" width="246.7" height="34" class="zone bad"/><text x="153.4" y="126.0" class="lbl" text-anchor="middle">Suspiciously cheap</text><rect x="276.7" y="70" width="143.9" height="34" class="zone okish"/><text x="348.7" y="126.0" class="lbl" text-anchor="middle">Below the fair range</text><rect x="420.7" y="70" width="111.9" height="34" class="zone ok"/><text x="476.6" y="126.0" class="lbl" text-anchor="middle">Fair price</text><rect x="532.6" y="70" width="157.4" height="34" class="zone warn"/><text x="611.3" y="126.0" class="lbl" text-anchor="middle">Too high</text><line x1="276.7" y1="62" x2="276.7" y2="112" class="tickline"/><text x="276.7" y="56.0" class="val" text-anchor="middle">€972</text><line x1="420.7" y1="62" x2="420.7" y2="112" class="tickline"/><text x="420.7" y="56.0" class="val" text-anchor="middle">€1,539</text><line x1="532.6" y1="62" x2="532.6" y2="112" class="tickline"/><text x="532.6" y="56.0" class="val" text-anchor="middle">€1,980</text></svg>
